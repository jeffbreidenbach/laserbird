plugins {
    id 'com.android.application'
    id 'de.undercouch.download'
}

// Release signing is read from keystore.properties (not checked in), e.g.
//   storeFile=/path/to/release.jks
//   keyAlias=...
// Passwords may also go in that file (storePassword=, keyPassword=), but it is
// safer to supply them only for the build via environment variables:
//   read -rs KEYSTORE_PASSWORD && export KEYSTORE_PASSWORD
//   ./gradlew assembleRelease
// KEY_PASSWORD defaults to the store password (the norm for PKCS12 keystores).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def storePass = keystoreProps['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD')
def keyPass = keystoreProps['keyPassword'] ?: System.getenv('KEY_PASSWORD') ?: storePass
def canSignRelease = keystorePropsFile.exists() && storePass

android {
    namespace = 'org.jab.laserbird'
    compileSdk = 37

    defaultConfig {
        applicationId = "org.jab.laserbird"
        minSdk = 24
        targetSdk = 37
        versionCode = 6
        versionName = "1.0.5"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile = file(keystoreProps['storeFile'])
                storePassword = storePass
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        debug {
            // Lets a debug build be installed alongside the release app.
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            if (canSignRelease) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// import DownloadMPTasks task
project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
apply from: 'download_tasks.gradle'

dependencies {

    // Kotlin lang
    implementation 'androidx.core:core-ktx:1.19.1'

    // App compat and UI things
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'

    // Navigation library
    def nav_version = "2.10.2"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"

    // CameraX
    def camerax_version = '1.7.0'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // WindowManager
    implementation 'androidx.window:window:1.5.1'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'

    // Instrumented testing
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // MediaPipe Library
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'

    // Security floors for transitive dependencies pulled in by MediaPipe.
    constraints {
        implementation('com.google.protobuf:protobuf-javalite:4.36.2') {
            because 'CVE-2024-7254 (fixed in 4.28.2)'
        }
        implementation('com.google.guava:guava:33.8.0-android') {
            because 'CVE-2020-8908, CVE-2023-2976, CVE-2026-102554 (fixed in 33.7.2)'
        }
    }
}
